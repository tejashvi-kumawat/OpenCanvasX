name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap
        run: |
          dart pub global activate melos
          dart pub get
          melos bootstrap

      - name: Build Linux bundle
        working-directory: apps/desktop
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter build linux --release

      - name: Checksums
        run: |
          cd apps/desktop/build/linux/x64/release/bundle
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/build/linux/x64/release/bundle/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Placeholders for platform signing (wire secrets in maintainer docs):
      # WINDOWS_SIGNING_CERT, APPLE_SIGNING_IDENTITY
